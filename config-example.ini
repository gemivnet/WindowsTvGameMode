; WindowsTvGameMode configuration template.
;
; This is a reference template. The installer's setup wizard normally writes
; your real config to %APPDATA%\WindowsTvGameMode\config.ini, and you can edit
; it anytime from the in-app Settings dialog. To seed a config by hand, copy
; this file to that location (or next to the app as a legacy fallback, which is
; migrated on first run) and edit the values. config.ini is gitignored so your
; personal paths never end up in the repo.

[General]
; Poll interval for the Xbox Guide button (ms). Lower = more responsive, slightly more CPU.
PollInterval=75
; Show a tray notification each time game mode toggles.
ShowNotifications=true
; Require the Guide button to be held this long (ms) to toggle. Short presses
; pass through to Windows / Playnite so the button still works normally in-game.
; 5000 = 5 second hold. Set to 0 for instant toggle on release.
HoldDurationMs=5000

[Tools]
; Path to Monitor Profile Switcher by Martin Krämer
; (https://sourceforge.net/projects/monitorswitcher/)
MonitorSwitcher=C:\Tools\MonitorSwitcher\MonitorSwitcher.exe
; Path to NirSoft SoundVolumeView (https://www.nirsoft.net/utils/sound_volume_view.html)
SoundVolumeView=C:\Tools\SoundVolumeView\SoundVolumeView.exe

[Display]
; Full paths to Monitor Profile Switcher XML profiles.
;
; To create them:
;   1. Launch MonitorSwitcher.exe (it sits in the tray).
;   2. Arrange Windows exactly how you want DESKTOP mode (monitors on, TV off).
;   3. Tray icon -> "Save profile as..." -> name it "desktop".
;   4. Arrange exactly how you want TV mode (TV on, other monitors off).
;   5. Tray icon -> "Save profile as..." -> name it "tv".
;
; Profiles are stored as XML in %APPDATA%\MonitorSwitcher\Profiles\.
; These keys want the FULL file path, not just the profile name.
TvProfile=%APPDATA%\MonitorSwitcher\Profiles\tv.xml
DesktopProfile=%APPDATA%\MonitorSwitcher\Profiles\desktop.xml
; Milliseconds to wait after applying a display change before continuing (audio/Playnite).
SettleDelayMs=2500

[Audio]
; Substring of the device name as shown in Windows Sound settings / SoundVolumeView.
; Tip: run SoundVolumeView.exe /scomma devices.csv to list all device names.
TvDevice=<your TV name, e.g. Hisense>
DesktopDevice=<your desktop output, e.g. Speakers>
; Apply to both "Console" (default) and "Multimedia". Leave as "all" for most setups.
Role=all

[Playnite]
; Launch Playnite Fullscreen when entering TV mode.
Launch=true
; Default install path. %LOCALAPPDATA% is expanded at load time.
Path=%LOCALAPPDATA%\Playnite\Playnite.FullscreenApp.exe
; Close Playnite when exiting TV mode.
CloseOnExit=true
