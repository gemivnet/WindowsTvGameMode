name: Release

# Matches any v-prefixed tag, two-part (v1.2) or three-part (v1.2.0). The
# version injected into the app is the tag minus the "v".
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version from tag
        id: ver
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          if ($version -notmatch '^\d+(\.\d+){1,2}$') {
            Write-Error "Tag '${{ github.ref_name }}' is not vMAJOR.MINOR[.PATCH]"
            exit 1
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Inject version into source
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $v = "${{ steps.ver.outputs.version }}"
          $file = "src\lib\version.ahk"
          $body = Get-Content $file -Raw
          if ($body -notmatch '0\.0\.0-dev') { throw "Version placeholder missing from $file" }
          ($body -replace '0\.0\.0-dev', $v) | Set-Content $file -NoNewline
          Write-Host "Injected version $v"

      - uses: ./.github/actions/build-installer
        with:
          version: ${{ steps.ver.outputs.version }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/WindowsTvGameModeSetup.exe
          generate_release_notes: true
          make_latest: 'true'
          fail_on_unmatched_files: true
